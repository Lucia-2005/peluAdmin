<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeluAdmin - Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- SIDEBAR / MENU LATERAL -->
    <aside>
        <h2>PeluAdmin</h2>
        <nav>
            <ul>
                <li><a href="#dashboard" aria-current="page">Dashboard</a></li>
                <li><a href="#calendario">Calendario</a></li>
                <li><a href="#clientes">Clientes</a></li>
                <li><a href="#inventario">Inventario</a></li>
                <li><a href="#servicios">Servicios</a></li>
            </ul>
        </nav>
    </aside>

    <!-- HEADER Y MAIN -->
    <div class="main-wrapper">

        <!-- ENCABEZADO SUPERIOR -->
        <header>
            <h1>DASHBOARD</h1>
            <div>
                <span id="user-name"></span>
                <img id="user-avatar" src="" alt="Foto de perfil" width="40" height="40">
            </div>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main id="main-content">

            <!-- SECCION 1: METRICAS CLAVE -->
            <section id="metricas-clave">
                <article>
                    <h3>Ingresos Estimados</h3>
                    <p id="ingresos-mes"></p>
                </article>

                <article>
                    <h3>Servicios Realizados</h3>
                    <p id="total-servicios"></p>
                </article>

                <article>
                    <h3>Productos Usados</h3>
                    <p id="total-productos"></p>
                </article>

                <article>
                    <h3>Clientes Atendidos</h3>
                    <p id="total-clientes"></p>
                </article>
            </section>

            <!-- SECCION 2: OPERATIVA DIARIA -->
            <section id="operativa-dashboard">

                <!-- Citas proximas del dia -->
                <article>
                    <h3>Proximas Citas de Hoy</h3>
                    <ul id="lista-citas-hoy">
                        <!-- Se insertaran dinamicamente los <li> -->
                    </ul>
                </article>

                <!-- Grafico: Servicios mas solicitados -->
                <article>
                    <h3>Servicios mas solicitados</h3>
                    <div id="contenedor-grafico-servicios">
                        <!-- Canvas o SVG del grafico -->
                    </div>
                </article>

                <!-- Alertas de Stock necesario -->
                <article>
                    <h3>Restock mas necesario</h3>
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">Producto</th>
                                <th scope="col">Stock Actual</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-restock-body">
                            <!-- Se insertaran dinamicamente los <tr> -->
                        </tbody>
                    </table>
                </article>

            </section>

        </main>

    </div>

</body>
</html>
